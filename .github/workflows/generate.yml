name: generate

# Manual: produce more profiles against the dataset already published in `dist`
# and publish as `dist-<base>-N`, where base is the newest bare
# `dist-YYYY-MM-DD` sync tag (or today, if none exists yet) and N increments
# across that base's publishes.
#
# Every run starts on a fresh runner. `restore-dist` pulls the `dist` snapshot
# back (one codeload request) — both the existing profiles (so `run` treats them
# as cache and only fills what's missing) and the dataset mirror (so `run` can
# read SKILL.md). Generate never touches upstream: the dataset is exactly what
# the last `sync` published; `limit` bounds how much new work happens per run,
# while the CLI's `SKILLS_PROFILES_TOTAL_LIMIT` (default 1000, not set here so the
# default holds) is a ceiling on the dataset: only the most installed N skills are
# ever profiled, so repeated runs walk down that window and never past it.
#
# Repository configuration (Settings -> Secrets and variables -> Actions):
#   Secret:   SKILLS_PROFILES_API_KEY, SKILLS_PROFILES_IMAGE_API_KEY (and
#             optionally SKILLS_PROFILES_IMAGE_API_KEYS: N keys, N times the
#             per-minute image quota)
#   Variable: SKILLS_PROFILES_BASE_URL, SKILLS_PROFILES_MODEL,
#             SKILLS_PROFILES_IMAGE_BASE_URL, SKILLS_PROFILES_IMAGE_MODEL,
#             SKILLS_PROFILES_IMAGE_SIZE (all optional)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: How many skills to complete this run (text + cover)
        default: "10"
      concurrency:
        description: Max concurrent LLM calls / image requests
        default: "8"

permissions:
  contents: write

concurrency:
  group: publish-dist
  cancel-in-progress: false # never cancel a run that is about to push

env:
  # credentials only; every tunable is passed as a CLI argument
  SKILLS_PROFILES_API_KEY: ${{ secrets.SKILLS_PROFILES_API_KEY }}
  SKILLS_PROFILES_BASE_URL: ${{ vars.SKILLS_PROFILES_BASE_URL }}
  SKILLS_PROFILES_MODEL: ${{ vars.SKILLS_PROFILES_MODEL }}
  SKILLS_PROFILES_IMAGE_API_KEY: ${{ secrets.SKILLS_PROFILES_IMAGE_API_KEY }}
  SKILLS_PROFILES_IMAGE_API_KEYS: ${{ secrets.SKILLS_PROFILES_IMAGE_API_KEYS }}
  SKILLS_PROFILES_IMAGE_BASE_URL: ${{ vars.SKILLS_PROFILES_IMAGE_BASE_URL }}
  SKILLS_PROFILES_IMAGE_MODEL: ${{ vars.SKILLS_PROFILES_IMAGE_MODEL }}
  SKILLS_PROFILES_IMAGE_SIZE: ${{ vars.SKILLS_PROFILES_IMAGE_SIZE }}

jobs:
  generate:
    runs-on: ubuntu-latest
    # renders are paced at the endpoint's per-minute quota per key: a 100-cover
    # batch takes ~50 min on one key, so the timeout must cover the wait, not
    # just the work (every network call itself is bounded, see config/images)
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Restore dist snapshot (profiles + dataset)
        uses: ./.github/actions/restore-dist

      - name: Generate profiles
        run: |
          args=()
          if [ -n "${{ inputs.limit }}" ]; then
            args+=(--limit "${{ inputs.limit }}")
          fi
          if [ -n "${{ inputs.concurrency }}" ]; then
            args+=(--concurrency "${{ inputs.concurrency }}")
          fi
          uv run skills-profiles run "${args[@]}"

      - name: Publish to dist
        uses: ./.github/actions/publish-dist
        with:
          tag-mode: date-counter
