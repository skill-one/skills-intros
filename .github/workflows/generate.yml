name: generate

# Incremental generation + publishing:
#
#   resolve tag -> restore cache (dataset) -> restore (dist tarball, output)
#              -> sync (dataset + prune stale) -> run -> publish
#
# Every run starts on a fresh runner. The dataset is restored from actions/cache
# (keyed by the upstream daily tag, resolved by the CLI's own resolver), so within
# a day `sync` has nothing to download; the published outputs are pulled back from
# the `dist` branch (one tarball request) and order matters because sync prunes
# stale results against what is already there. `run` never redoes cached work, so
# the `limit` input bounds how much is generated per run — the branch is both the
# artifact and the cache.
#
# Repository configuration (Settings -> Secrets and variables -> Actions):
#   Secret:   SKILLS_INTROS_API_KEY
#   Variable: SKILLS_INTROS_BASE_URL, SKILLS_INTROS_MODEL

on:
  workflow_dispatch:
    inputs:
      limit:
        description: How many skills to generate this run
        default: "100"

permissions:
  contents: write

concurrency:
  group: generate-dist
  cancel-in-progress: false # never cancel a run that is about to push

env:
  # credentials only; every tunable is passed as a CLI argument
  SKILLS_INTROS_API_KEY: ${{ secrets.SKILLS_INTROS_API_KEY }}
  SKILLS_INTROS_BASE_URL: ${{ vars.SKILLS_INTROS_BASE_URL }}
  SKILLS_INTROS_MODEL: ${{ vars.SKILLS_INTROS_MODEL }}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Resolve upstream snapshot tag
        id: ref
        # Reuses the CLI's own resolver so the cache key and `sync` agree on the
        # newest tag; falls back to "dist" when upstream publishes no tags.
        run: |
          set -euo pipefail
          tag=$(uv run python -c 'from skills_intros.data import latest_dist_tag; print(latest_dist_tag() or "")')
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: cache/skills-sh
          # One cache entry per upstream tag: hit within a day -> `sync` is a no-op.
          key: dataset-${{ steps.ref.outputs.tag || 'dist' }}

      - name: Restore published intros
        run: |
          set -euo pipefail
          mkdir -p output
          if curl -fsSL "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/dist" \
              -o "${RUNNER_TEMP}/dist.tar.gz"; then
            tar -xzf "${RUNNER_TEMP}/dist.tar.gz" -C output --strip-components=1
            echo "Restored $(find output/skills -name '*.json' 2>/dev/null | wc -l) prompt outputs"
          else
            echo "No dist branch yet: starting from an empty output/"
          fi

      - name: Sync dataset
        run: uv run skills-intros sync

      - name: Generate intros
        run: uv run skills-intros run --limit "${{ inputs.limit }}"

      - name: Publish to dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          dist="${RUNNER_TEMP}/dist"
          rm -rf "$dist"
          if ! git clone --depth 1 --branch dist "$remote" "$dist" 2>/dev/null; then
            # first publish: the branch does not exist yet
            mkdir -p "$dist"
            git -C "$dist" init -q
            git -C "$dist" checkout -q -b dist
            git -C "$dist" remote add origin "$remote"
          fi
          find "$dist" -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -a output/. "$dist/"
          cd "$dist"
          git -C "$dist" config user.name "github-actions[bot]"
          git -C "$dist" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to publish"
            exit 0
          fi
          git commit -q -m "intros: ${GITHUB_RUN_ID} at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin dist
          echo "Published $(find skills -name '*.json' | wc -l) prompt outputs" \
              >> "$GITHUB_STEP_SUMMARY"
