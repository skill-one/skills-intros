name: generate

# Manual: produce more profiles against the current dataset and publish as
# `dist-<base>-N`, where base is the newest bare `dist-YYYY-MM-DD` sync tag (or
# today, if none exists yet) and N increments across that base's publishes.
#
# Every run starts on a fresh runner. The published outputs are pulled back from
# the `dist` branch (one tarball request) so `run` sees existing prompts as
# cache and only fills in what's missing; `limit` therefore bounds how much is
# generated per run — the branch is both the artifact and the cache.
#
# Repository configuration (Settings -> Secrets and variables -> Actions):
#   Secret:   SKILLS_PROFILES_API_KEY
#   Variable: SKILLS_PROFILES_BASE_URL, SKILLS_PROFILES_MODEL

on:
  workflow_dispatch:
    inputs:
      limit:
        description: How many skills to generate this run
        default: "10"
      concurrency:
        description: Max concurrent LLM calls
        default: "8"

permissions:
  contents: write

concurrency:
  group: publish-dist
  cancel-in-progress: false # never cancel a run that is about to push

env:
  # credentials only; every tunable is passed as a CLI argument
  SKILLS_PROFILES_API_KEY: ${{ secrets.SKILLS_PROFILES_API_KEY }}
  SKILLS_PROFILES_BASE_URL: ${{ vars.SKILLS_PROFILES_BASE_URL }}
  SKILLS_PROFILES_MODEL: ${{ vars.SKILLS_PROFILES_MODEL }}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Restore published profiles
        run: |
          set -euo pipefail
          mkdir -p output
          if curl -fsSL "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/dist" \
              -o "${RUNNER_TEMP}/dist.tar.gz"; then
            tar -xzf "${RUNNER_TEMP}/dist.tar.gz" -C output --strip-components=1
            echo "Restored $(find output/skills -name '*.json' 2>/dev/null | wc -l) prompt outputs"
          else
            echo "No dist branch yet: starting from an empty output/"
          fi

      - name: Generate profiles
        run: |
          args=()
          if [ -n "${{ inputs.limit }}" ]; then
            args+=(--limit "${{ inputs.limit }}")
          fi
          if [ -n "${{ inputs.concurrency }}" ]; then
            args+=(--concurrency "${{ inputs.concurrency }}")
          fi
          uv run skills-profiles run "${args[@]}"

      - name: Publish to dist
        uses: ./.github/actions/publish-dist
        with:
          tag-mode: date-counter
