name: sync

# Manual: refresh the upstream dataset, invalidate cached outputs whose upstream
# content hash changed, and publish the result (profiles + the dataset mirror) as
# `dist-YYYY-MM-DD` (force-updated within a day, so the bare date tag always
# points at the newest sync of that day).
#
# The `dist` branch is the single atomic snapshot: profiles at its root plus the
# `cache/skills-sh` dataset mirror. Restoring it back is what lets a later
# `generate` run without ever touching upstream. `sync` re-downloads only when
# the restored snapshot's marker lags the newest upstream tag.
#
# Repository configuration (Settings -> Secrets and variables -> Actions):
#   Secret:   SKILLS_PROFILES_API_KEY
#   Variable: SKILLS_PROFILES_BASE_URL, SKILLS_PROFILES_MODEL

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-dist
  cancel-in-progress: false # never cancel a run that is about to push

env:
  # credentials only; every tunable is passed as a CLI argument
  SKILLS_PROFILES_API_KEY: ${{ secrets.SKILLS_PROFILES_API_KEY }}
  SKILLS_PROFILES_BASE_URL: ${{ vars.SKILLS_PROFILES_BASE_URL }}
  SKILLS_PROFILES_MODEL: ${{ vars.SKILLS_PROFILES_MODEL }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Restore dist snapshot (profiles + dataset)
        uses: ./.github/actions/restore-dist

      - name: Sync dataset
        # pulls the newest upstream tag only when the restored snapshot lags it
        run: uv run skills-profiles sync

      - name: Invalidate stale results
        # results whose upstream content hash changed (or whose skill vanished)
        # are dropped here, explicitly — sync itself never touches results
        run: uv run skills-profiles invalidate --stale

      - name: Publish to dist
        uses: ./.github/actions/publish-dist
        with:
          tag-mode: date
